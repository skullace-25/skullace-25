<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="50%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace; }
      .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    </style>
  </defs>

  <rect x="60" y="8" width="700" height="2" rx="1" fill="url(#footGrad)" opacity="0.7"/>
  <circle class="pulse-dot" cx="410" cy="34" r="4" fill="#00e5ff"/>
  <text x="410" y="38" text-anchor="middle" fill="#c9d1d9" font-size="13" letter-spacing="1" class="sans">Building. Automating. Securing.</text>
  <text x="410" y="56" text-anchor="middle" fill="#8b949e" font-size="11" class="mono">© 2026 SANDEEP S RAJESH</text>
</svg>
